name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      # tests/test_example_demo.py runs the demo and compares its output with
      # the block pasted in the README, so a stale README fails here.
      - name: Pytest
        run: pytest

      - name: Offline demo
        run: python examples/hero_chain.py

      # Self-test, part one: the tool on its own workflows. A SHELL or SPOOF
      # verdict here exits 1 and fails the build; --strict also fails on
      # SUSPECT or UNKNOWN.
      - name: taint-trail on its own workflows
        run: taint-trail .github/workflows --strict

      # Self-test, part two: the tool on two fixtures it must flag, the classic
      # run: injection and the one-line brace group into $GITHUB_OUTPUT. This
      # proves the analyser detects; part one alone would pass for a tool that
      # finds nothing. tests/test_self_ci.py runs this same script.
      - name: taint-trail on known-bad fixtures
        run: |
          set +e
          out="$(taint-trail tests/fixtures/workflows/direct_run_injection.yml tests/fixtures/workflows/spoof_oneline_brace_group.yml)"
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -eq 1
          grep -q "SHELL:" <<<"$out"
          grep -q "SPOOF:" <<<"$out"
