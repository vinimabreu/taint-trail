name: Step shell wins over job and workflow defaults
on:
  issue_comment:
    types: [created]
defaults:
  run:
    shell: pwsh
jobs:
  j:
    runs-on: windows-latest
    defaults:
      run:
        shell: python
    steps:
      - shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
        run: eval "$BODY"
