name: Moved, not fixed
on:
  issue_comment:
    types: [created]
jobs:
  helper:
    if: contains(github.event.comment.body, '/helper')
    runs-on: ubuntu-latest
    steps:
      - name: Run the helper with the comment
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "received a request"
          eval "$BODY"
