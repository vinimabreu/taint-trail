name: Documented gap, github-script reading context.payload
on:
  issue_comment:
    types: [created]
jobs:
  gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            require('child_process').execSync(`echo ${body}`);
