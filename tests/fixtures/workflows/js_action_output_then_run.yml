name: JavaScript action output, then run
on:
  issue_comment:
    types: [created]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - id: x
        uses: example/js-output-action@v1
        with:
          prompt: ${{ github.event.comment.body }}
      - run: echo ${{ steps.x.outputs.result }}
