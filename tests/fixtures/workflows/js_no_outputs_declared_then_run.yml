name: JavaScript action with no declared outputs, then run
on:
  issue_comment:
    types: [created]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - id: x
        uses: example/js-no-outputs@v1
        env:
          HELPER_PROMPT: ${{ github.event.comment.body }}
      - run: echo ${{ steps.x.outputs.anything }}
