name: Output with a random delimiter
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          delimiter="$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            echo "$BODY"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
