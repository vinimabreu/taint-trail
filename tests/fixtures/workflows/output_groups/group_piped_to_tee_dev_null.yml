name: Group piped into tee -a with stdout discarded
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          { echo "x<<EOF"; echo "$BODY"; echo "EOF"; } | tee -a "$GITHUB_OUTPUT" >/dev/null
