name: Closing line merges stderr before the append
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          {
            echo "x<<EOF"
            echo "$BODY"
            echo "EOF"
          } 2>&1 >> "$GITHUB_OUTPUT"
