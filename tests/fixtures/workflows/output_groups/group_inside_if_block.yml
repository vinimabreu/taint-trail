name: Group inside a multi-line if
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          if [ -n "$BODY" ]; then
            { echo "x<<EOF"; echo "$BODY"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
