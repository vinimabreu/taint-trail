name: Shell heredoc redirected to the output file, marker inside
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          cat <<EOF >> "$GITHUB_OUTPUT"
          x<<INNER
          $BODY
          INNER
          EOF
