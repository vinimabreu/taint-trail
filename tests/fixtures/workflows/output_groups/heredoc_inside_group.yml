name: Shell heredoc inside a group that is appended
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          {
            cat <<EOF
          x<<INNER
          $BODY
          INNER
          EOF
          } >> "$GITHUB_OUTPUT"
