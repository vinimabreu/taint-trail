name: Group, backslash continuation before the redirect
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          { echo "x<<EOF"; echo "$BODY"; echo "EOF"; } \
            >> "$GITHUB_OUTPUT"
