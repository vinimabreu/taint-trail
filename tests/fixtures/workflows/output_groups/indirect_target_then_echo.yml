name: Target held in a variable, single-line write
on:
  issue_comment:
    types: [created]
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          OUT=$GITHUB_OUTPUT
          echo "k=$BODY" >> $OUT
